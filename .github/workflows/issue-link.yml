name: Issue link

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  issue-link:
    runs-on: ubuntu-latest
    steps:
      - env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "$BODY" | grep -Eiq '\b(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+'; then
            echo "PR body links an issue."
          else
            echo "PR body must contain 'Closes #N', 'Fixes #N' or 'Resolves #N'." >&2
            exit 1
          fi
