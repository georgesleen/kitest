site_name: kitest
site_description: Simulation-based tests for KiCad designs
site_url: https://georgesleen.com/kitest/
repo_url: https://github.com/georgesleen/kitest
repo_name: georgesleen/kitest
edit_uri: edit/main/docs/
copyright: LGPL-3.0-or-later

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [crates/kitest-py/python]
          options:
            allow_inspection: false
            docstring_style: google
            heading_level: 2
            members_order: alphabetical
            show_if_no_docstring: true
            show_submodules: true
            show_root_heading: true
            show_signature_annotations: true
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Guide:
      - Getting started: guide/getting-started.md
      - Writing Expect fields: guide/expect.md
      - kitest.toml: guide/config.md
      - Models: guide/models.md
      - The kitest command: guide/cli.md
  - Reference:
      - Python API: reference/python.md
      - Rust API: reference/rust.md
  - Project:
      - Roadmap: roadmap.md
      - Architecture: architecture.md
      - Decisions: decisions.md
      - Workflow: workflow.md
