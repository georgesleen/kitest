# SPICE models kitest supplies for common parts, matched to a part's Value.
#
# Each entry names the Values it covers and holds one card. A `.model` card
# wires pins by device role (C B E for a BJT). A `.subckt` card lists its
# `ports` as the pin role on each port, in the card's own port order.

[[model]]
values = ["2N3904"]
source = "Fairchild 2N3904, 88-09-08"
card = """
.model 2N3904 npn(is=6.734f xti=3 eg=1.11 vaf=74.03 bf=416.4 ne=1.259
+ ise=6.734f ikf=66.78m xtb=1.5 br=.7371 nc=2 isc=0 ikr=0 rc=1
+ cjc=3.638p mjc=.3085 vjc=.75 fc=.5 cje=4.493p mje=.2593 vje=.75
+ tr=239.5n tf=301.2p itf=.4 vtf=4 xtf=2 rb=10)
"""
